[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "openmdbench"
version = "0.1.0"
description = "OpenMDBench multi-domain maritime simulation benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Research use; see repository terms" }
authors = [{ name = "OpenMDBench contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
core = [
  "gymnasium>=1.0,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "pyproj>=3.6,<4",
  "pyyaml>=6,<7",
  "taichi>=1.7,<2",
]
train = [
  "einops>=0.8,<1",
  "torch>=2.10,<3",
  "tqdm>=4.66,<5",
  "wandb>=0.17,<1",
]
server = [
  "fastapi>=0.141,<1",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.30,<1",
]
# Taichi discovers an available CUDA runtime at execution time.  Keeping a named
# group makes acceleration an explicit, stable install surface without forcing
# vendor-specific CUDA wheels into the CPU baseline.
cuda = []
dev = [
  "bandit>=1.7,<2",
  "build>=1.2,<2",
  "hatchling>=1.25,<2",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["openmdbench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
minversion = "8.2"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["openmdbench", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
files = ["openmdbench", "tests"]
