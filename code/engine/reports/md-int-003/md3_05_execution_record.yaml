    renamed-synthetic contract tests; syntax/import and scoped diff checks.
COMMAND_TIMEOUT: 300
TOTAL_BUDGET: 120
ACCEPTANCE:
  - Public contact-only intercept helper emits an ordinary navigation proposal
    and has no WorldState import or write path.
  - Continuous, parameterized geometry facts cover radial crossing, annular
    sector occupancy, front-of-track occupancy, path conflict debounce,
    blocked/slow duration and replanning latency without changing health.
  - Mission and score consumers use authoritative facts, preserve terminal
    priority/latch and checkpoint equivalence, and distinguish structural N/A
    from expected-but-missing data with explicit metric_data_missing evidence.
  - A fully renamed synthetic scenario can exercise the reusable mechanisms.
OUTPUTS:
  - Public SDK helper, generic geometry/mission/scoring/checkpoint path,
    failure-oriented contract tests, execution evidence and report.
STOP_CONDITIONS:
  - The feature requires a scenario ID, faction or fixed entity ID branch; a
    helper needs truth WorldState; geometry directly changes health; or the
    current resolved/checkpoint model cannot represent authoritative evidence.
