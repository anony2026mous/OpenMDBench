  - Hard-coded benchmark geometry, durations, mission names, score weights, or
    real-world parameter claims.
  - ScenarioPackage/registry/interface expansion beyond the generic data contract;
    T4/T5, full-suite, performance/soak/security tests, commit, push, merge, or cleanup.
