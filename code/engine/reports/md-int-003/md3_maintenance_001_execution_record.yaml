RESULT:
  STATUS: DONE
  HEAD: 9429392666df2928fc61934e49923733deeacb1d
  REPRODUCTION:
    - >-
      Before the repair, a valid 18 m/s attacker-USV navigation command produced
      approximately 0.0024 m/s after the first tick and 0.045 m/s after 20 ticks.
      The 5 rps native envelope was the limiting path.
    - >-
      Entity.state.energy is a 0..1 fraction while the USV weapon declared
      energy_per_shot as 15000 J.  Combat therefore compared 0..1 against 15000
      and rejected every otherwise legal fire request.
    - >-
      At the final duration interval, physical motion advanced from tick 1499 to
      1500, but mission evaluation still used tick 1499.  The time rule never
      observed its declared deadline and terminal_result remained null.
  REPAIR:
    - >-
      Extended the generic Sim2Sea L7-proxy actuator ceiling to 240 rps and
      configured each MMG adapter from its data-declared speed bound; the two
      MD-INT-003 USV resources now declare the actuator envelopes required for
      their requested 15/18 m/s operating targets.
    - >-
      Kept runtime energy as a dimensionless fraction: converted catalog energy
      rates and the defender weapon per-shot cost by their declared capacity,
      and exposed mission energy facts with unit 1.
    - >-
      Moved generic mission/scoring evaluation to the post-interval World tick,
      and mapped timeout to Gymnasium truncated=True (not terminated=True).
