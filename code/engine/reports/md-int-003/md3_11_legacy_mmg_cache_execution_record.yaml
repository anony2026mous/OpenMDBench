PROHIBITED:
  - Dynamics model/parameter changes, replay or checkpoint contract changes,
    test weakening, dependency changes, global cross-adapter state sharing,
    commits, pushes, and cleanup.
TEST_LEVEL: T5
ALLOWED_COMMANDS:
  - Focused pytest, deterministic runtime benchmarks, py_compile, Ruff, mypy,
    source scans, and scoped diff checks.
COMMAND_TIMEOUT: 1800
TOTAL_BUDGET: 180
ACCEPTANCE:
  - Consecutive steps of one adapter do not reset the shared core.
  - Switching adapters reloads the active adapter's own state before stepping.
  - Snapshot/restore and 1,000-tick existing MMG regression remain deterministic.
OUTPUTS:
  - Cached owner-aware MMG adapter, isolation regression test, and performance
    evidence suitable for a fresh full-quality run.
STOP_CONDITIONS:
  - The source reveals hidden per-step state that cannot be represented by the
    adapter snapshot, or the optimization changes an existing trajectory.
RESULT:
  STATUS: DONE
  TESTS:
    - >-
      Focused legacy MMG adapter regression passed; fresh integration and full
      pytest groups passed, including snapshot/restore and 1,000-tick coverage.
  REVIEW:
    STATUS: SELF_REVIEWED
    DETAIL: >-
      An adapter reuses its core for uninterrupted own-state steps and reloads
      state when ownership switches, preserving per-adapter isolation.
  COMPATIBILITY: Existing adapter snapshot and trajectory interfaces unchanged.
  DETERMINISM: Cached reuse and switching are covered by deterministic regression.
  DOMAIN_IMPACT: No MMG parameter or fidelity adjustment.
  RISKS: Native core lifecycle remains monitored by the MD3-11 resource probes.
