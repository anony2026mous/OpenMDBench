PROHIBITED:
  - Scenario/faction/platform/entity-ID branches in production Python.
  - Direct health, speed, capability, or lifecycle mutation by scenario data.
  - A second collision/damage/lifecycle system or non-deterministic global RNG.
  - Real-world parameter claims, T4/T5, full-suite, performance/soak/security tests,
    commit, push, merge, or cleanup.
TEST_LEVEL: T2/T3
ALLOWED_COMMANDS:
  - Focused source-event, boundary/collision, lifecycle/checkpoint and combat tests.
  - Read-only inspection, syntax/import, git status and diff checks.
COMMAND_TIMEOUT: 300
TOTAL_BUDGET: 90
ACCEPTANCE:
  - A data-defined one-shot zone/collision trigger creates only authoritative
    Effect/DamageIntent records and cannot fire again after restore.
  - Trigger lifecycle is data-selected: despawn or static wreck; a wreck cannot
    move, sense, communicate, or fire but remains collision-visible.
  - Secondary effects use deterministic independent identity-derived sampling and
    data-defined target filtering; all effects still use simultaneous resolution.
  - Continuous crossing and entity collision evidence determines source ordering,
    with no entity traversal order dependence.
OUTPUTS:
  - Generic trigger/effect/lifecycle/checkpoint path, focused tests and report.
STOP_CONDITIONS:
  - The capability requires a scenario-ID branch or bypasses DamageIntent.
  - Existing continuous boundary/collision evidence cannot identify source ordering.
  - Wreck lifecycle cannot be represented without a second mutable world model.
