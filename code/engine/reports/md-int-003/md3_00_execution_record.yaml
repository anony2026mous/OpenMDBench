  - docs/
  - openmdbench/
  - tests/
  - scenarios/
  - catalog/
  - reports/platform-refactor/
  - artifacts/
  - .git
ALLOWED_WRITE:
  - reports/md-int-003/md3_00_execution_record.yaml
  - reports/md-int-003/md3_00_baseline_audit.md
  - reports/md-int-003/requirements_traceability.md
  - reports/md-int-003/test_baseline.md
PROHIBITED:
  - Production code, schema, Catalog, ScenarioPackage, test, dependency, or configuration changes.
  - Any MD-INT-003 scenario-ID, fixed-faction, fixed-entity-ID, or fixed-parameter branch.
  - T2+ tests, full test suites, performance, concurrency, security, soak, commits, pushes, merges, or cleanup.
TEST_LEVEL: T0/T1
ALLOWED_COMMANDS:
  - Read-only filesystem inspection (rg, find, sed, git status/diff/log/show).
  - Test collection and a small existing V2 smoke test with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1.
COMMAND_TIMEOUT: 300
TOTAL_BUDGET: 50
ACCEPTANCE:
  - No production code changes in the phase diff.
  - All V4 chapters and U1-U13 are traceable to REQ IDs, current evidence, a classification, target, test, and review status.
  - Every claimed existing capability has file/symbol/test evidence or is marked PARTIAL, ABSENT, UNVALIDATED, DEFECT, or NEEDS_DECISION.
  - Git/working-tree baseline and test results are recorded with reproducible commands.
OUTPUTS:
  - reports/md-int-003/md3_00_baseline_audit.md
  - reports/md-int-003/requirements_traceability.md
  - reports/md-int-003/test_baseline.md
STOP_CONDITIONS:
  - Required source, map, Catalog, schema, test, or preceding evidence cannot be read.
  - A requirements conflict changes mechanism semantics or needs parameter/competition-policy choice.
  - A requested action would require production changes or T2+ testing before MD3-00 gate completion.
