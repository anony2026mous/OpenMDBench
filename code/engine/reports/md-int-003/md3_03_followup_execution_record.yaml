PROHIBITED:
  - Scenario/faction/platform/entity-ID branches, scenario or Catalog changes,
    global RNG, direct health/lifecycle mutation, a second combat/damage path,
    T4/T5, full-suite, dependency change, commit, push, cleanup or generated-artifact write.
TEST_LEVEL: T2/T3
ALLOWED_COMMANDS:
  - Focused combat/world/checkpoint/MD3 scenario session contracts, syntax/import,
    and scoped diff/no-scenario-branch checks.
COMMAND_TIMEOUT: 300
TOTAL_BUDGET: 60
ACCEPTANCE:
  - contact_detonation is data-selected, never scenario-selected, and its legal
    profile can load without weakening validation of unknown delivery models.
  - A legal contact delivery produces a single authoritative DamageIntent at the
    configured tick; illegal requests have no ammo/RNG side effects.
  - Existing instant, delayed-effect and guided-missile compatibility, checkpoint,
    deterministic identity and lifecycle contracts continue to pass.
OUTPUTS:
  - Generic CombatSystem delivery support, failure-oriented contract regression,
    and updated MD3-03 evidence.
STOP_CONDITIONS:
  - Support needs a scenario identity or bypasses the existing combat/damage/
    lifecycle authority path.
RESULT:
  STATUS: DONE
  TESTS:
    - >-
      Contact-delivery launch/one-tick-impact contract added; focused MD3-03
      combat, damage, World checkpoint, MD-AD rule-agent and migration regressions
      completed without a failure.
    - >-
      MD-INT-003 L1 public-rule-agent session loaded and advanced one tick with
      three attacker navigation commands; its dedicated system test passed 4/4.
  REVIEW:
    STATUS: SELF_REVIEWED
    DETAIL: >-
      Reviewed the delivery-model whitelist, exact delay validation, shared
      pending-impact construction, unknown-model rejection, legality-before-RNG,
      checkpoint ownership and scenario-neutral source scan. No P0/P1 found in
      the follow-up scope. This is single-Codex self-review, not independent review.
  COMPATIBILITY: >-
    instant and guided_missile retain zero-delay validation; delayed_effect retains
    its pending-impact semantics. contact_detonation now has the same explicit
    nonzero-delay contract and does not alter existing resource definitions.
  DETERMINISM: >-
    Contact delivery reuses the existing request/shot-index pending-impact
    identities and named shot evidence; no global RNG or session-specific branch
    was introduced.
  DOMAIN_IMPACT: >-
    A contact-compatible weapon can remain in a normal entity loadout and session
    CombatSystem profile without bypassing Effect/DamageIntent/Lifecycle authority.
  RISKS: >-
    Benchmark weapon values remain UNVALIDATED_BENCHMARK. This phase does not
    claim real-world contact-fuse calibration and did not run T4/T5.
  NEXT_GATE: "MD3-03 follow-up DONE; return to MD3-07 data-only scenario execution."
