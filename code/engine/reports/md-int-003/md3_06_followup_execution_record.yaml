ACCEPTANCE:
  - Sensor profile fields use generic `detection_probability`, `update_ticks`,
    `range_noise_fraction`, and `bearing_noise_deg` semantics at fixed ticks.
  - Noise derives from a stable named substream anchored by seed/tick/owner/
    sensor/target; entity registration order and session ID do not change it.
  - Generic World-owned contact fusion consumes profile confirmation/stale/
    confidence/age data; public contacts retain no truth-only fields and
    checkpoint restoration is event/contact equivalent across an update-period
    boundary.
OUTPUTS:
  - Generic sensing implementation, failure-oriented contract tests and updated
    MD3-06 evidence.
STOP_CONDITIONS:
