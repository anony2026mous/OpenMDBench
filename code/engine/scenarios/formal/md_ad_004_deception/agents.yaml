schema_version: rule-agent-team@2.0
objective_m: [0.0, 0.0]
protected_zone_bounds_m: [-8000.0, -8000.0, 8000.0, 8000.0]
decision_interval_ticks: 10
attack:
  faction_id: coalition.intruder
  pattern: direct
  speed_mps: 42.0
  split_angle_deg: 0.0
  serpentine_angle_deg: 0.0
  serpentine_period_ticks: 1
  timeline:
    - {label: diversion, spawn_tick: 0, count: 3, axis: south-west, behavior: "turn away at tick 112 before weapon-range engagement; preserve missiles and positions for the later main wave"}
    - {label: main, spawn_tick: 320, count: 3, axis: north-east, behavior: "continue toward three separated points inside the protected zone"}
  routes:
    - {match_tag: diversion-south, until_tick: 112, objective_m: [0.0, -3500.0], speed_mps: 42.0}
    - {match_tag: diversion-south, start_tick: 112, objective_m: [36000.0, -9000.0], speed_mps: 42.0}
    - {match_tag: diversion-center, until_tick: 112, objective_m: [0.0, -1500.0], speed_mps: 42.0}
    - {match_tag: diversion-center, start_tick: 112, objective_m: [36000.0, -2500.0], speed_mps: 42.0}
    - {match_tag: diversion-north, until_tick: 112, objective_m: [0.0, 500.0], speed_mps: 42.0}
    - {match_tag: diversion-north, start_tick: 112, objective_m: [36000.0, 4000.0], speed_mps: 42.0}
    - {match_tag: main-north, objective_m: [0.0, 3000.0], speed_mps: 42.0}
    - {match_tag: main-center, objective_m: [0.0, 0.0], speed_mps: 42.0}
    - {match_tag: main-south, objective_m: [0.0, -3000.0], speed_mps: 42.0}
defence:
  faction_id: coalition.defender
  intercept_speed_mps: 40.0
  contact_confidence: 0.55
  maximum_contact_age_ticks: 10
  weapon_policies:
    - selector_tags: [interceptor]
      weapon_ref: weapon.interceptor-missile@2.0.0
      minimum_range_m: 500.0
      maximum_range_m: 8000.0
      cooldown_ticks: 5
