schema_version: rule-agent-team@2.0
set:
  name: IE 拦截交战场景集
  member_index: 11
  zh_name: 诱饵掩护主攻
  notes: 诱饵**前置**：无武器诱饵先到、真主攻晚 150 tick 才出现，惩罚'见接触就打'。难度取 IE-05 与 IE-06 之间（红 4+3+2诱饵、我 4+4、ingress 0.86、雾 700）。
objective_m:
- -1200.0
- -200.0
protected_zone_bounds_m:
- -1500.0
- -700.0
- 1000.0
- 100.0
decision_interval_ticks: 5
facility_weights:
  facility.command: 1.5
  facility.berth: 1.0
defence:
  faction_id: coalition.defender
  contact_confidence: 0.0
  maximum_contact_age_ticks: 8
  intercept_speed_mps: 43.0
  weapon_policies:
  - selector_tags:
    - interceptor
    weapon_ref: weapon.air-interceptor-munition@2.0.0
    minimum_range_m: 500.0
    maximum_range_m: 8000.0
    cooldown_ticks: 5
  - selector_tags:
    - usv
    weapon_ref: weapon.surface-missile@2.0.0
    minimum_range_m: 0.0
    maximum_range_m: 3000.0
    cooldown_ticks: 3
attack:
  faction_id: coalition.intruder
  pattern: direct
  speed_mps: 43.0
  split_angle_deg: 0.0
  serpentine_angle_deg: 0.0
  serpentine_period_ticks: 1
  routes:
  - match_tag: uav
    objective_m:
    - -1200.0
    - -200.0
    pattern: direct
    speed_mps: 43.0
  - match_tag: boat
    objective_m:
    - 700.0
    - -400.0
    pattern: direct
    speed_mps: 10.0
  - match_tag: decoy
    until_tick: 150
    objective_m:
    - -1200.0
    - -200.0
    pattern: direct
    speed_mps: 43.0
  - match_tag: decoy
    start_tick: 150
    objective_m:
    - 32000.0
    - -9000.0
    pattern: direct
    speed_mps: 43.0
  timeline:
  - label: decoy screen
    spawn_tick: 0
    count: 2
    axis: south-east, offset from the real strike axis
    behavior: 'declared DECOYS: unarmed, they close on a plausible bearing first and turn away at tick 150; spending interceptors on them leaves the real package free'
  - label: real air package
    spawn_tick: 150
    count: 4
    axis: east and north-east, 15-19 km out
    behavior: the four armed UAVs appear only after the decoys have already drawn attention
  - label: surface element
    spawn_tick: 0
    count: 3
    axis: east, 7-9 km out, slow
    behavior: three suicide boats run at the harbour-mouth berth throughout, so the berth cannot be ignored while the air picture is being sorted out
  weapon_policies:
  - match_tag: boat
    weapon_ref: weapon.suicide-warhead@2.0.0
    min_range_m: 0.0
    max_range_m: 150.0
    shots: 1
    reserve_for_assigned: 0
  - match_tag: uav
    weapon_ref: weapon.loitering-munition@2.0.0
    min_range_m: 500.0
    max_range_m: 8000.0
    shots: 1
    reserve_for_assigned: 1
