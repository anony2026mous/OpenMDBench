  - state.active
  - state.assets-lost
  - state.defence-success
  - state.defenders-destroyed
  - state.intruders-destroyed
  mission_rules:
  - schema_version: '2.0'
    id: rule.assets-lost
    priority: 100
    depends_on: []
    condition:
      schema_version: '2.0'
      operator: count
      selector:
        schema_version: '2.0'
        factions:
        - coalition.defender
        tags:
        - facility
      parameters:
        comparison: <=
        value: 0
    outcome:
      set_state: state.assets-lost
      emit_event: event.assets-lost
      terminal: true
      result: intruder_success
      ranking:
        coalition.intruder: 1
        coalition.defender: 2
  - schema_version: '2.0'
    id: rule.defenders-destroyed
    priority: 90
    depends_on: []
