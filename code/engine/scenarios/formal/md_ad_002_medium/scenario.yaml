  mission_rules:
    - schema_version: "2.0"
      id: rule.breach-failure
      priority: 100
      depends_on: []
      condition:
        schema_version: "2.0"
        operator: count
        selector: {schema_version: "2.0", factions: [coalition.intruder], tags: [intruder], zones: [zone.denial]}
        parameters: {comparison: ">=", value: 3, zone_id: zone.denial}
      outcome: {set_state: state.breach-failure, emit_event: event.breach-failure, terminal: true, result: intruder_success, ranking: {coalition.intruder: 1, coalition.defender: 2}}
    - schema_version: "2.0"
      id: rule.timeout-success
      priority: 50
      depends_on: []
      condition: {schema_version: "2.0", operator: time, selector: {schema_version: "2.0", factions: [coalition.defender]}, parameters: {comparison: ">=", tick: 1800}}
      outcome: {set_state: state.defence-success, emit_event: event.timeout-success, terminal: true, result: defender_success, ranking: {coalition.defender: 1, coalition.intruder: 2}}
