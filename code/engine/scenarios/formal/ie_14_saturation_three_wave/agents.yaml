schema_version: rule-agent-team@2.0
set:
  name: IE 拦截交战场景集
  member_index: 14
  zh_name: 三波饱和突击
  notes: 三波饱和：t=0/300/600 三波共 7 机 5 船，全程持续施压，考察长时段弹药与兵力轮换。难度取 IE-07 与 MD-AD-006 之间（红 7+5、我 6+6、ingress 0.70、雾 300、horizon 1500）。
objective_m:
- -1200.0
- -200.0
protected_zone_bounds_m:
- -1500.0
- -700.0
- 1000.0
- 100.0
decision_interval_ticks: 5
facility_weights:
  facility.command: 2.0
  facility.berth: 1.0
defence:
  faction_id: coalition.defender
  contact_confidence: 0.0
  maximum_contact_age_ticks: 8
  intercept_speed_mps: 43.0
  weapon_policies:
  - selector_tags:
    - interceptor
    weapon_ref: weapon.air-interceptor-munition@2.0.0
    minimum_range_m: 500.0
    maximum_range_m: 8000.0
    cooldown_ticks: 5
  - selector_tags:
    - usv
    weapon_ref: weapon.surface-missile@2.0.0
    minimum_range_m: 0.0
    maximum_range_m: 3000.0
    cooldown_ticks: 3
attack:
  faction_id: coalition.intruder
  pattern: direct
  speed_mps: 43.0
  split_angle_deg: 0.0
  serpentine_angle_deg: 0.0
  serpentine_period_ticks: 1
  routes:
  - match_tag: uav
    objective_m:
    - -1200.0
    - -200.0
    pattern: direct
    speed_mps: 43.0
  - match_tag: boat
    objective_m:
    - 700.0
    - -400.0
    pattern: direct
    speed_mps: 10.0
  timeline:
  - label: wave 1
    spawn_tick: 0
    count: 5
    axis: east and north-east, 16-18 km out
    behavior: three UAVs run at the command post and two suicide boats at the berth
  - label: wave 2
    spawn_tick: 300
    count: 4
    axis: east, 20-23 km out
    behavior: two more UAVs and two more boats; arriving while wave 1 is still being engaged
  - label: wave 3
    spawn_tick: 600
    count: 2
    axis: east, 23-25 km out
    behavior: 'a final pair of UAVs: ammunition held back for wave 2 must still leave something for wave 3'
  weapon_policies:
  - match_tag: boat
    weapon_ref: weapon.suicide-warhead@2.0.0
    min_range_m: 0.0
    max_range_m: 150.0
    shots: 1
    reserve_for_assigned: 0
  - match_tag: uav
    weapon_ref: weapon.loitering-munition@2.0.0
    min_range_m: 500.0
    max_range_m: 8000.0
    shots: 1
    reserve_for_assigned: 1
