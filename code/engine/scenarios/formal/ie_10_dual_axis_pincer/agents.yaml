schema_version: rule-agent-team@2.0
set:
  name: IE 拦截交战场景集
  member_index: 10
  zh_name: 双轴钳形夹击
  notes: 钳形同时到达：两轴相隔约 90 度、且到打窗口几乎重合，考察同一时刻的跨域资源分配。难度取 IE-03 与 IE-04 之间（红 3+3、我 4+4、ingress 0.90）。
objective_m:
- -1200.0
- -200.0
protected_zone_bounds_m:
- -1500.0
- -700.0
- 1000.0
- 100.0
decision_interval_ticks: 5
facility_weights:
  facility.command: 1.5
  facility.berth: 1.0
defence:
  faction_id: coalition.defender
  contact_confidence: 0.0
  maximum_contact_age_ticks: 8
  intercept_speed_mps: 43.0
  weapon_policies:
  - selector_tags:
    - interceptor
    weapon_ref: weapon.air-interceptor-munition@2.0.0
    minimum_range_m: 500.0
    maximum_range_m: 8000.0
    cooldown_ticks: 5
  - selector_tags:
    - usv
    weapon_ref: weapon.surface-missile@2.0.0
    minimum_range_m: 0.0
    maximum_range_m: 3000.0
    cooldown_ticks: 3
attack:
  faction_id: coalition.intruder
  pattern: direct
  speed_mps: 43.0
  split_angle_deg: 0.0
  serpentine_angle_deg: 0.0
  serpentine_period_ticks: 1
  routes:
  - match_tag: uav
    objective_m:
    - -1200.0
    - -200.0
    pattern: direct
    speed_mps: 43.0
  - match_tag: boat
    objective_m:
    - 700.0
    - -400.0
    pattern: direct
    speed_mps: 10.0
  timeline:
  - label: air arm
    spawn_tick: 0
    count: 3
    axis: north-east, bearing about 045, 13-16 km out
    behavior: three UAVs run at the command post; they reach weapon range at roughly the same tick as the surface arm reaches the berth
  - label: surface arm
    spawn_tick: 0
    count: 3
    axis: south-east, bearing about 135, 8-9 km out
    behavior: three suicide boats run at the harbour-mouth berth; armed only at 150 m, so they must be stopped before they close, at the same time the air arm is engaged
  weapon_policies:
  - match_tag: boat
    weapon_ref: weapon.suicide-warhead@2.0.0
    min_range_m: 0.0
    max_range_m: 150.0
    shots: 1
    reserve_for_assigned: 0
  - match_tag: uav
    weapon_ref: weapon.loitering-munition@2.0.0
    min_range_m: 500.0
    max_range_m: 8000.0
    shots: 1
    reserve_for_assigned: 1
