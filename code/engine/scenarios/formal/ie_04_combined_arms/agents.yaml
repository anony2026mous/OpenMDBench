schema_version: rule-agent-team@2.0
set:
  name: IE 拦截交战场景集
  member_index: 4
  zh_name: 联合兵种攻击
  notes: 空中远而快、水面近而慢，两类到达时间明显错开，考察异构平台协同与跨域资源调度。水面打击目标原为陆上油料设施，自爆船无法抵达（只能搁浅），第 11 轮改指港口入口泊位。
objective_m:
- -1200.0
- -200.0
protected_zone_bounds_m:
- -1500.0
- -700.0
- 1000.0
- 100.0
decision_interval_ticks: 5
facility_weights:
  facility.command: 2.0
  facility.berth: 1.0
defence:
  faction_id: coalition.defender
  contact_confidence: 0.0
  maximum_contact_age_ticks: 8
  intercept_speed_mps: 43.0
  weapon_policies:
  - selector_tags:
    - interceptor
    weapon_ref: weapon.air-interceptor-munition@2.0.0
    minimum_range_m: 500.0
    maximum_range_m: 8000.0
    cooldown_ticks: 5
  - selector_tags:
    - usv
    weapon_ref: weapon.surface-missile@2.0.0
    minimum_range_m: 0.0
    maximum_range_m: 3000.0
    cooldown_ticks: 3
attack:
  faction_id: coalition.intruder
  pattern: direct
  speed_mps: 43.0
  split_angle_deg: 0.0
  serpentine_angle_deg: 0.0
  serpentine_period_ticks: 1
  routes:
  - match_tag: uav
    objective_m:
    - -1200.0
    - -200.0
    pattern: direct
    speed_mps: 43.0
  - match_tag: boat
    objective_m:
    - 700.0
    - -400.0
    pattern: direct
    speed_mps: 10.0
  timeline:
  - label: air element
    spawn_tick: 0
    count: 3
    axis: north-east, 20-24 km out but fast (43 m/s)
    behavior: runs at the command post; reaches weapon range well before the surface element
  - label: surface element
    spawn_tick: 0
    count: 3
    axis: south-east, only 6-7 km out but slow (10 m/s)
    behavior: suicide boats run at the harbour-mouth berth; they arrive well after the air element
  weapon_policies:
  - match_tag: boat
    weapon_ref: weapon.suicide-warhead@2.0.0
    min_range_m: 0.0
    max_range_m: 150.0
    shots: 1
    reserve_for_assigned: 0
  - match_tag: uav
    weapon_ref: weapon.loitering-munition@2.0.0
    min_range_m: 500.0
    max_range_m: 8000.0
    shots: 1
    reserve_for_assigned: 1
