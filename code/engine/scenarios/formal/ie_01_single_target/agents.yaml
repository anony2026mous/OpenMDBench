  pattern: direct
  speed_mps: 43.0
  split_angle_deg: 0.0
  serpentine_angle_deg: 0.0
  serpentine_period_ticks: 1
  routes:
  - match_tag: uav
    objective_m:
    - -1200.0
    - -200.0
    pattern: direct
    speed_mps: 43.0
  timeline:
  - label: single intruder UAV
    spawn_tick: 0
    count: 1
    axis: east
    behavior: straight run at the command post; no evasive manoeuvre and no second wave
  weapon_policies:
  - match_tag: uav
    weapon_ref: weapon.loitering-munition@2.0.0
    min_range_m: 500.0
    max_range_m: 8000.0
    shots: 1
    reserve_for_assigned: 1
