  member_index: 1
  zh_name: 单目标拦截
  notes: 最小规模：单架突防无人机攻击指挥所，考察发现—跟踪—拦截链是否闭环。
objective_m:
- -1200.0
- -200.0
protected_zone_bounds_m:
- -1500.0
- -500.0
- -900.0
- 100.0
decision_interval_ticks: 5
facility_weights:
