    trigger:
      tick: 55
    payload:
      session_id: outage.1
      source_entity_id: unit.x03
      target_entity_id: unit.r01
  - schema_version: '2.0'
    id: event.jam-end-0
    event_type: jamming_end
    trigger:
      tick: 135
    payload:
      session_id: outage.1
  - schema_version: '2.0'
    id: event.deadline
    event_type: mission_marker
    trigger:
      tick: 241
    payload:
      marker_id: marker.deadline
  - schema_version: '2.0'
    id: event.success
    event_type: mission_marker
    trigger:
      tick: 241
    payload:
      marker_id: marker.success
  - schema_version: '2.0'
    id: event.timeout
    event_type: mission_marker
    trigger:
      tick: 241
    payload:
      marker_id: marker.timeout
  mission_states:
  - state.active
  - state.success
  - state.timeout
  mission_rules:
  - schema_version: '2.0'
    id: rule.success
    priority: 100
    depends_on: []
    condition:
      schema_version: '2.0'
      operator: all
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
      parameters:
        conditions:
        - operator: time
          parameters:
            comparison: '>='
            tick: 241
        - operator: score
          parameters:
            metric_id: metric.protection
            comparison: '>='
            value: 0.9
        - operator: score
          parameters:
            metric_id: metric.breaches
            comparison: '>='
            value: 1.0
        - operator: score
          parameters:
            metric_id: metric.outage_protection
            comparison: '>='
            value: 0.95
    outcome:
      set_state: state.success
      emit_event: event.success
      terminal: true
      result: objective_complete
      ranking:
        red: 1
        blue: 2
  - schema_version: '2.0'
    id: rule.timeout
    priority: 10
    depends_on: []
    condition:
      schema_version: '2.0'
      operator: time
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
      parameters:
        comparison: '>='
        tick: 241
    outcome:
      set_state: state.timeout
      emit_event: event.timeout
      terminal: true
      result: objective_incomplete
      ranking:
        red: 2
        blue: 1
  scoring:
    aggregation_version: utility-v1
    aggregation: sum
    direction: maximize
    weight_policy: normalized_sum_one
    metrics:
    - id: metric.protection
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
        - unit.r02
        - unit.r03
      aggregation: mean
      unit: '1'
      direction: maximize
      weight: 0.3333333333333333
      available: true
      value: 0.0
      required: true
      normalization:
        lower_bound: 0.0
        upper_bound: 1.0
      plugin_ref: models.competition-denial-metrics@1.0.0
      plugin_parameters:
        metric_id: metric.protection
        kind: protection_fraction
        zone_ids:
        - zone.protected01
        intruder_ids:
        - unit.x01
        - unit.x02
        protected_entities: []
        start_tick: 1
        end_tick: 241
        maximum_breaches_per_zone: 0
        unit: '1'
    - id: metric.breaches
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
        - unit.r02
        - unit.r03
