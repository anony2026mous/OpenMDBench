      unit: '1'
      direction: maximize
      weight: 0.3333333333333333
      available: true
      value: 0.0
      required: true
      normalization:
        lower_bound: 0.0
        upper_bound: 1.0
      plugin_ref: models.competition-denial-metrics@1.0.0
