schema_version: package@2.0
adapter_id: adapter.v2
scenario:
  schema_version: '2.0'
  scenario_id: competition.MD-ER-004.standard
  factions:
  - schema_version: '2.0'
    id: red
  - schema_version: '2.0'
    id: blue
  relationships: []
  entities:
  - schema_version: '2.0'
    id: unit.r01
    faction_id: red
    platform_ref: platform.interceptor-uav@2.0.0
    dynamics_ref: dynamics.interceptor-uav@2.0.0
    component_refs:
    - communication.competition-dispatch@1.0.0
    controller_slot: slot.unit.r01
    initial_state:
      schema_version: '2.0'
      position_m:
      - 0.0
      - 0.0
      - 100.0
      velocity_mps:
      - 0.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  - schema_version: '2.0'
    id: unit.r02
    faction_id: red
    platform_ref: platform.interceptor-uav@2.0.0
    dynamics_ref: dynamics.interceptor-uav@2.0.0
    component_refs:
    - communication.competition-dispatch@1.0.0
    controller_slot: slot.unit.r02
    initial_state:
      schema_version: '2.0'
      position_m:
      - 0.0
      - 300.0
      - 100.0
      velocity_mps:
      - 0.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  - schema_version: '2.0'
    id: unit.r03
    faction_id: red
    platform_ref: platform.competition-shore-site@1.0.0
    dynamics_ref: dynamics.fixed-site@2.0.0
    component_refs:
    - communication.competition-dispatch@1.0.0
    controller_slot: slot.unit.r03
    initial_state:
      schema_version: '2.0'
      position_m:
      - -250.0
      - -250.0
      - 0.0
      velocity_mps:
      - 0.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  - schema_version: '2.0'
    id: unit.x01
    faction_id: blue
    platform_ref: platform.competition-shore-site@1.0.0
    dynamics_ref: dynamics.fixed-site@2.0.0
    component_refs:
    - communication.competition-dispatch@1.0.0
    controller_slot: slot.unit.x01
    initial_state:
      schema_version: '2.0'
      position_m:
      - 0.0
      - 600.0
      - 0.0
      velocity_mps:
      - 0.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  formations: []
  world:
    schema_version: '2.0'
    coordinate_system: local_m
    duration_ticks: 181
    tick_seconds: 1.0
    zones:
    - schema_version: '2.0'
      id: zone.request01
      geometry_type: polygon
      coordinates_m:
      - - 1100.0
        - -100.0
      - - 1300.0
        - -100.0
      - - 1300.0
        - 100.0
      - - 1100.0
        - 100.0
  events:
  - schema_version: '2.0'
    id: event.blackout
    event_type: jamming_start
    trigger:
      tick: 12
    payload:
      session_id: outage.01
      source_entity_id: unit.x01
      target_entity_id: unit.r01
  - schema_version: '2.0'
    id: event.restore
    event_type: jamming_end
    trigger:
      tick: 90
    payload:
      session_id: outage.01
  - schema_version: '2.0'
    id: event.deadline
    event_type: mission_marker
    trigger:
      tick: 181
    payload:
      marker_id: marker.deadline
  - schema_version: '2.0'
    id: event.success
    event_type: mission_marker
    trigger:
      tick: 181
    payload:
      marker_id: marker.success
  - schema_version: '2.0'
    id: event.timeout
    event_type: mission_marker
    trigger:
      tick: 181
    payload:
      marker_id: marker.timeout
  mission_states:
  - state.active
  - state.success
  - state.timeout
  mission_rules:
  - schema_version: '2.0'
    id: rule.success
    priority: 100
    depends_on: []
    condition:
      schema_version: '2.0'
      operator: all
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
      parameters:
        conditions:
        - operator: score
          parameters:
            metric_id: metric.arrival
            comparison: '>='
            value: 1.0
        - operator: score
          parameters:
            metric_id: metric.safety
            comparison: '>='
            value: 1.0
    outcome:
      set_state: state.success
      emit_event: event.success
      terminal: true
      result: objective_complete
      ranking:
        red: 1
        blue: 2
  - schema_version: '2.0'
    id: rule.timeout
    priority: 10
    depends_on: []
    condition:
      schema_version: '2.0'
      operator: time
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
      parameters:
        comparison: '>='
        tick: 181
    outcome:
      set_state: state.timeout
      emit_event: event.timeout
      terminal: true
      result: objective_incomplete
      ranking:
        red: 2
        blue: 1
  scoring:
    aggregation_version: utility-v1
    aggregation: sum
    direction: maximize
    weight_policy: normalized_sum_one
    metrics:
    - id: metric.arrival
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
        - unit.r02
      aggregation: mean
      unit: '1'
      direction: maximize
      weight: 0.6
      available: true
      value: 0.0
      required: true
      normalization:
        lower_bound: 0.0
        upper_bound: 1.0
      plugin_ref: models.competition-dispatch-metrics@1.0.0
      plugin_parameters:
        metric_id: metric.arrival
        kind: arrival_fraction
        observer_ids:
        - unit.r01
        - unit.r02
        requests:
        - request_id: request.01
          zone_id: zone.request01
          release_event_id: null
          deadline_tick: 180
          weight: 1.0
          dwell_ticks: 3
          observer_ids:
          - unit.r01
          - unit.r02
        hazards: []
        start_tick: 1
        end_tick: 181
        unit: '1'
    - id: metric.timeliness
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
        - unit.r02
      aggregation: mean
      unit: '1'
      direction: maximize
      weight: 0.2
      available: true
      value: 0.0
      required: true
      normalization:
        lower_bound: 0.0
        upper_bound: 1.0
      plugin_ref: models.competition-dispatch-metrics@1.0.0
      plugin_parameters:
        metric_id: metric.timeliness
        kind: timeliness
        observer_ids:
        - unit.r01
        - unit.r02
        requests:
        - request_id: request.01
          zone_id: zone.request01
          release_event_id: null
          deadline_tick: 180
          weight: 1.0
          dwell_ticks: 3
          observer_ids:
          - unit.r01
          - unit.r02
        hazards: []
        start_tick: 1
        end_tick: 181
        unit: '1'
    - id: metric.safety
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
        - unit.r02
      aggregation: mean
      unit: '1'
      direction: maximize
      weight: 0.2
      available: true
      value: 0.0
      required: true
      normalization:
        lower_bound: 0.0
        upper_bound: 1.0
      plugin_ref: models.competition-dispatch-metrics@1.0.0
      plugin_parameters:
        metric_id: metric.safety
        kind: route_safety
        observer_ids:
        - unit.r01
        - unit.r02
        requests:
        - request_id: request.01
          zone_id: zone.request01
          release_event_id: null
          deadline_tick: 180
          weight: 1.0
          dwell_ticks: 3
          observer_ids:
          - unit.r01
          - unit.r02
        hazards: []
        start_tick: 1
        end_tick: 181
        unit: '1'
  score_metrics: []
  controller_policy: explicit_uncontrolled
  controller_slots:
  - id: slot.unit.r01
    controller_id: agent.unit.r01
    faction_id: red
    controller_endpoint_ref: unit.r01
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.r01
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  - id: slot.unit.r02
    controller_id: agent.unit.r02
    faction_id: red
    controller_endpoint_ref: unit.r02
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.r02
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  - id: slot.unit.r03
    controller_id: agent.unit.r03
    faction_id: red
    controller_endpoint_ref: unit.r03
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.r03
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  - id: slot.unit.x01
    controller_id: agent.unit.x01
    faction_id: blue
    controller_endpoint_ref: unit.x01
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.x01
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  visibility:
  - view: referee
    scope: truth
    allow: true
  - view: public
    scope: public
    allow: true
  - view: faction
    faction_id: red
    scope: own_and_contacts
    allow: true
  - view: faction
    faction_id: blue
    scope: own_and_contacts
    allow: true
