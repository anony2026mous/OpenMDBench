schema_version: package@2.0
adapter_id: adapter.v2
scenario:
  schema_version: '2.0'
  scenario_id: competition.MD-REC-001.medium
  factions:
  - schema_version: '2.0'
    id: red
  - schema_version: '2.0'
    id: blue
  relationships: []
  entities:
  - schema_version: '2.0'
    id: unit.r01
    faction_id: red
    platform_ref: platform.interceptor-uav@2.0.0
    dynamics_ref: dynamics.interceptor-uav@2.0.0
    component_refs:
    - communication.command-network@2.0.0
    - sensor.competition-air-medium@1.0.0
    controller_slot: slot.unit.r01
    initial_state:
      schema_version: '2.0'
      position_m:
      - 0.0
      - 0.0
      - 100.0
      velocity_mps:
      - 0.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  - schema_version: '2.0'
    id: unit.r02
    faction_id: red
    platform_ref: platform.competition-picket-usv@1.1.0
    dynamics_ref: dynamics.competition-picket-usv@1.0.0
    component_refs:
    - communication.command-network@2.0.0
    - sensor.competition-surface-medium@1.0.0
    controller_slot: slot.unit.r02
    initial_state:
      schema_version: '2.0'
      position_m:
      - 0.0
      - -400.0
      - 0.0
      velocity_mps:
      - 0.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  - schema_version: '2.0'
    id: unit.r03
    faction_id: red
    platform_ref: platform.competition-shore-site@1.0.0
    dynamics_ref: dynamics.fixed-site@2.0.0
    component_refs:
    - communication.command-network@2.0.0
    - sensor.competition-shore-medium@1.0.0
    controller_slot: slot.unit.r03
    initial_state:
      schema_version: '2.0'
      position_m:
      - -300.0
      - 0.0
      - 0.0
      velocity_mps:
      - 0.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  - schema_version: '2.0'
    id: unit.x01
    faction_id: blue
    platform_ref: platform.competition-picket-usv@1.1.0
    dynamics_ref: dynamics.competition-picket-usv@1.0.0
    component_refs:
    - communication.command-network@2.0.0
    controller_slot: slot.unit.x01
    initial_state:
      schema_version: '2.0'
      position_m:
      - 1350.0
      - 100.0
      - 0.0
      velocity_mps:
      - 2.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  - schema_version: '2.0'
    id: unit.x02
    faction_id: blue
    platform_ref: platform.competition-picket-usv@1.1.0
    dynamics_ref: dynamics.competition-picket-usv@1.0.0
    component_refs:
    - communication.command-network@2.0.0
    controller_slot: slot.unit.x02
    initial_state:
      schema_version: '2.0'
      position_m:
      - 1510.0
      - 220.0
      - 0.0
      velocity_mps:
      - 2.0
      - 0.0
      - 0.0
      heading_deg: 90.0
      health: 1.0
      energy: 1.0
    tags: []
  formations: []
  world:
    schema_version: '2.0'
    coordinate_system: local_m
    duration_ticks: 161
    tick_seconds: 1.0
    zones:
    - schema_version: '2.0'
      id: zone.s01
      geometry_type: polygon
      coordinates_m:
      - - 470.0
        - -180.0
      - - 830.0
        - -180.0
      - - 830.0
        - 180.0
      - - 470.0
        - 180.0
    - schema_version: '2.0'
      id: zone.s02
      geometry_type: polygon
      coordinates_m:
      - - 1320.0
        - -180.0
      - - 1680.0
        - -180.0
      - - 1680.0
        - 180.0
      - - 1320.0
        - 180.0
  events:
  - schema_version: '2.0'
    id: event.success
    event_type: mission_marker
    trigger:
      tick: 161
    payload:
      marker_id: marker.success
  - schema_version: '2.0'
    id: event.timeout
    event_type: mission_marker
    trigger:
      tick: 161
    payload:
      marker_id: marker.timeout
  mission_states:
  - state.active
  - state.success
  - state.timeout
  mission_rules:
  - schema_version: '2.0'
    id: rule.success
    priority: 100
    depends_on: []
    condition:
      schema_version: '2.0'
      operator: all
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
      parameters:
        conditions:
        - operator: score
          parameters:
            metric_id: metric.recall
            comparison: '>='
            value: 1.0
        - operator: score
          parameters:
            metric_id: metric.coverage
            comparison: '>='
            value: 1.0
    outcome:
      set_state: state.success
      emit_event: event.success
      terminal: true
      result: objective_complete
      ranking:
        red: 1
        blue: 2
  - schema_version: '2.0'
    id: rule.timeout
    priority: 10
    depends_on: []
    condition:
      schema_version: '2.0'
      operator: time
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
      parameters:
        comparison: '>='
        tick: 161
    outcome:
      set_state: state.timeout
      emit_event: event.timeout
      terminal: true
      result: objective_incomplete
      ranking:
        red: 2
        blue: 1
  scoring:
    aggregation_version: utility-v1
    aggregation: sum
    direction: maximize
    weight_policy: normalized_sum_one
    metrics:
    - id: metric.recall
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
        - unit.r02
        - unit.r03
      aggregation: mean
      unit: '1'
      direction: maximize
      weight: 0.6
      available: true
      value: 0.0
      required: true
      normalization:
        lower_bound: 0.0
        upper_bound: 1.0
      plugin_ref: models.competition-observation-metrics@1.0.0
      plugin_parameters:
        metric_id: metric.recall
        kind: contact_recall
        observer_ids:
        - unit.r01
        - unit.r02
        - unit.r03
        item_ids:
        - unit.x01
        - unit.x02
        start_tick: 1
        end_tick: 161
        maximum_age_ticks: 2
        unit: '1'
    - id: metric.coverage
      selector:
        schema_version: '2.0'
        entity_ids:
        - unit.r01
        - unit.r02
        - unit.r03
      aggregation: mean
      unit: '1'
      direction: maximize
      weight: 0.4
      available: true
      value: 0.0
      required: true
      normalization:
        lower_bound: 0.0
        upper_bound: 1.0
      plugin_ref: models.competition-observation-metrics@1.0.0
      plugin_parameters:
        metric_id: metric.coverage
        kind: zone_visits
        observer_ids:
        - unit.r01
        - unit.r02
        - unit.r03
        item_ids:
        - zone.s01
        - zone.s02
        start_tick: 1
        end_tick: 161
        maximum_age_ticks: 2
        unit: '1'
  score_metrics: []
  controller_policy: explicit_uncontrolled
  controller_slots:
  - id: slot.unit.r01
    controller_id: agent.unit.r01
    faction_id: red
    controller_endpoint_ref: unit.r01
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.r01
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  - id: slot.unit.r02
    controller_id: agent.unit.r02
    faction_id: red
    controller_endpoint_ref: unit.r02
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.r02
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  - id: slot.unit.r03
    controller_id: agent.unit.r03
    faction_id: red
    controller_endpoint_ref: unit.r03
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.r03
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  - id: slot.unit.x01
    controller_id: agent.unit.x01
    faction_id: blue
    controller_endpoint_ref: unit.x01
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.x01
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  - id: slot.unit.x02
    controller_id: agent.unit.x02
    faction_id: blue
    controller_endpoint_ref: unit.x02
    selector:
      schema_version: '2.0'
      entity_ids:
      - unit.x02
    required_capabilities: []
    action_schema_ref: action-batch@2.0
    observation_schema_ref: observation@2.0
    exclusive: true
  visibility:
  - view: referee
    scope: truth
    allow: true
  - view: public
    scope: public
    allow: true
  - view: faction
    faction_id: red
    scope: own_and_contacts
    allow: true
  - view: faction
    faction_id: blue
    scope: own_and_contacts
    allow: true
